<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Chat widget demo</title>
  <style>
    /* Deliberately hostile host styles — the widget's Shadow DOM must ignore them. */
    body { margin: 0; font: 16px/1.6 Georgia, serif; color: #333; background: #fafafa; }
    button { background: hotpink !important; border-radius: 0 !important; }
    p, div { letter-spacing: .05em; }
    main { max-width: 720px; margin: 80px auto; padding: 0 24px; }
    code { background: #eee; padding: 2px 6px; }
  </style>
</head>
<body>
  <main>
    <h1>Chat widget demo</h1>
    <p>This page embeds the widget exactly as a client site would — one line:</p>
    <p><code>&lt;script src="https://&lt;backend&gt;/widget.js" async&gt;&lt;/script&gt;</code></p>
    <p>The page sets hot-pink square buttons and serif type on purpose. If the widget
       looks normal, its Shadow DOM isolation is working.</p>
    <p><button>A host-page button (should be pink)</button></p>
  </main>

  <script src="/widget.js" async></script>
</body>
</html>
